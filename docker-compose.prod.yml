services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_gateway}
      POSTGRES_DB: ${POSTGRES_DB:-llm_gateway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_gateway} -d ${POSTGRES_DB:-llm_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:16-alpine
    container_name: llm-gateway-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-llm_gateway}
      PGPASSWORD: ${POSTGRES_PASSWORD:-llm_gateway}
      PGDATABASE: ${POSTGRES_DB:-llm_gateway}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/db-migrate-up.sh:/usr/local/bin/db-migrate-up.sh:ro
    command: ["sh", "/usr/local/bin/db-migrate-up.sh"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-gateway-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:3212
      DATABASE_URL: postgres://${POSTGRES_USER:-llm_gateway}:${POSTGRES_PASSWORD:-llm_gateway}@postgres:5432/${POSTGRES_DB:-llm_gateway}?sslmode=disable
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      PROVIDER_KEY_SECRET: ${PROVIDER_KEY_SECRET:?PROVIDER_KEY_SECRET is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES:-127.0.0.1,172.16.0.0/12}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-credentials.json}
      LOG_BODY_DIR: ${LOG_BODY_DIR:-/var/lib/llm-gateway/request-log-bodies}
      LOG_BODY_RETENTION_DAYS: ${LOG_BODY_RETENTION_DAYS:-7}
    volumes:
      - ${GCP_CREDENTIALS_FILE:-/secrets/gcp-credentials.json}:/secrets/gcp-credentials.json:ro
      - request_log_bodies:/var/lib/llm-gateway/request-log-bodies
    expose:
      - "3212"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3212/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: llm-gateway-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: llm-gateway-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  request_log_bodies:
